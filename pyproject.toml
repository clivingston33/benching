[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benching"
version = "0.1.0"
description = "Benchmark LLM API providers against terminal-agent task suites"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "tokenizers>=0.20,<1",
  "huggingface_hub>=0.34,<2",
]

[project.scripts]
benchmarkctl = "benchmark.benchmarkctl:main"
benchmark-analyze = "analytics.analyze:main"

[tool.setuptools.packages.find]
include = ["benchmark*", "proxy*", "analytics*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

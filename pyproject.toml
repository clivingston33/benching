[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benching"
version = "0.2.0"
description = "Benchmark LLM API providers against terminal-agent task suites"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "tokenizers>=0.20,<1",
  "huggingface_hub>=0.34,<2",
  "typer>=0.12,<1",
  "rich>=13.0,<15",
  "prompt_toolkit>=3.0,<4",
  # Maintained JSON Schema validator for the producer/consumer artifact
  # boundary (summary.json, comparison-*.json). Used by contract checks.
  "jsonschema>=4.18,<5",
]

[project.scripts]
benching = "benching.cli.app:main"
benchmark-analyze = "benching.analytics.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["benching*"]

# Immutable package resources: the default benchmark manifest plus the
# authoritative contract schemas. Shipped in both wheel and sdist; loaded
# at runtime through importlib.resources, never via checkout paths.
[tool.setuptools.package-data]
"benching.benchmark" = ["resources/*.yaml", "resources/*.example", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

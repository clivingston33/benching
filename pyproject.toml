[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benching"
version = "0.1.0"
description = "Benchmark LLM API providers against terminal-agent task suites"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "tokenizers>=0.20,<1",
  "huggingface_hub>=0.34,<2",
  "typer>=0.12,<1",
  "rich>=13.0,<15",
]

[project.scripts]
benching = "cli.app:main"
benchmark-analyze = "analytics.analyze:main"

[tool.setuptools.packages.find]
include = ["benchmark*", "proxy*", "analytics*", "agents*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
